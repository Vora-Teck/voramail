<!-- Eduka AI – Markdown Rendering & Citation Support (Vanilla JS)
     Includes:
     - Markdown rendering (marked.js)
     - Syntax highlighting (highlight.js)
     - Academic citation blocks
     - Export-ready structure
-->
<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eduka AI – Agent Output</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Inter, system-ui; }
    .container { max-width:900px; margin:40px auto; }
    .card { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:24px; }
    .markdown h1,.markdown h2,.markdown h3 { color:#f8fafc; margin-top:24px; }
    .markdown p { line-height:1.75; margin:14px 0; }
    .markdown code { background:#020617; padding:4px 6px; border-radius:6px; }
    .markdown pre { background:#020617; border-radius:12px; padding:16px; overflow:auto; }
    .citation { border-left:4px solid #6366f1; background:#020617; padding:14px 18px; margin:18px 0; border-radius:8px; }
    .citation-title { font-weight:600; color:#a5b4fc; margin-bottom:6px; }
    .citation-item { font-size:14px; color:#c7d2fe; margin:6px 0; }
  </style></head>
<body><div class="container">
  <div class="card">
    <div id="agentOutput" class="markdown"></div><div class="citation">
  <div class="citation-title">References</div>
  <div class="citation-item">[1] Creswell, J. W. (2014). Research Design. Sage Publications.</div>
  <div class="citation-item">[2] APA (2020). Publication Manual of the American Psychological Association.</div>
</div>

  </div>
</div><script>
  const markdownResponse = `
# Research Analysis Result

## Key Findings
The study demonstrates a **significant relationship** between study habits and academic performance.

## Code Example
${"```python
import numpy as np
print(np.mean([80, 85, 90]))
```"}

## Discussion
These findings align with prior studies [1]. Ethical considerations were maintained throughout the research [2].`;

  document.querySelector('#agentOutput').innerHTML = marked.parse(markdownResponse) || markdownResponse;
</script></body>
</html>
