ect\",\n            \"updated_at\":\"2026-05-22T15:21:08.490444\"\n          },\n          {\n            \"created_at\":\"2026-05-22T15:20:03.223866\",\n            \"message_id\":\"9d338728-17bd-4cf4-8287-3d28c565dda6\",\n            \"mode\":\"api\",\n            \"status\":\"failed\",\n            \"subject\":\"Test Subject\",\n            \"updated_at\":\"2026-05-22T15:20:03.756158\"\n          }\n        ],\n        \"has_next\":false,\n        \"has_prev\":false,\n        \"page\":1,\n        \"pages\":1,\n        \"total_items\":2\n      }\n      ```\n\n      ## Sample Error Response\n      ```json\n      {\n        \"error\":\"Invalid account ID\",\n      }\n      ```\n  - info:\n      name: Get Mail Status/Info\n      type: http\n      seq: 1\n    http:\n      method: GET\n      url: https://mx.vorateck.com.ng/api/mails/{mail_id}\n      headers:\n        - name: X-API-KEY\n          value: your-api-key\n        - name: X-SECRET-KEY\n          value: your-secret-key\n        - name: Accept\n          value: application/json\n      auth: inherit\n    runtime:\n      variables:\n        - name: mail_id\n          value: id_of_mail\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      - This endpoint fetches your mail status/info using the `mail_id` (a UUID string)\n\n      ## Sample Success Response\n      ```json\n      {\n        \"callback_sent\":false,\n        \"callback_url\":\"\",\n        \"created_at\":\"2026-05-22T15:21:03.723584\",\n        \"ip_address\":\"127.0.0.1\",\n        \"message\": \"your_message_content\",\n        \"message_id\":\"b77d64ad-2ce0-4001-b18c-ba5a77fad8c6\",\n        \"mode\":\"api\",\n        \"recipients\":[\"example@gmail.com\"],\n        \"sender\": \"sender@gmail.com\",\n        \"status\":\"success\",\n        \"subject\":\"Test Subject\"\n      }\n      ```\n\n      ## Sample Error Response\n      ```json\n      {\n        \"error\":\"Invalid mail ID\",\n      }\n      ```\n  - info:\n      name: Send Mail\n      type: http\n      seq: 2\n    http:\n      method: POST\n      url: https://mx.vorateck.com.ng/api/send-mail\n      headers:\n        - name: X-API-KEY\n          value: your-api-key\n        - name: X-SECRET-KEY\n          value: your-secret-key\n        - name: Content-Type\n          value: application/json\n        - name: Accept\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"account_id\": \"your_email_account_id\",\n            \"subject\": \"your_email_subject\",\n            \"content\": \"your_email_content (html content supported)\",\n            \"recipients\": [\n              \"user1@example.com\",\n              \"user2@example.com\"\n            ]\n          }\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      ## Sample Success Response\n      ```json\n      // successful request\n      {\n        \"success\": true,\n        \"message_id\": \"b77d64ad-2ce0-4001-b18c-ba5a77fad8c6\",\n        \"status\": \"completed\",\n        \"message\": \"message sent successfully\"\n      }\n\n      // request error\n      {\n        \"success\": false,\n        \"message_id\": \"b77d64ad-2ce0-4001-b18c-ba5a77fad8c6\",\n        \"status\": \"failed\",\n        \"message\": \"Missing required fields\"\n      }\n      ```\n\n      ## Sample Error Response\n      ```json\n      {\n        \"error\":\"server error: {error_details}\",\n      }\n      ```\n  - info:\n      name: Get Account List\n      type: http\n      seq: 4\n    http:\n      method: GET\n      url: https://mx.vorateck.com.ng/api/accounts\n      headers:\n        - name: X-API-KEY\n          value: your-api-key\n        - name: X-SECRET-KEY\n          value: your-secret-key\n        - name: Accept\n          value: application/json\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |-\n      - This endpoint fetches your email accounts list.\n\n      ## Sample Success Response\n      ```json\n      [\n        {\n          \"account_id\":\"voramx_s7v230fqri\",\n          \"active\":true,\n          \"created_at\":\"2026-05-22T11:22:25.589088\",\n          \"name\":\"VoraMX\",\n          \"smtp_data\":{\n            \"password_help_url\":\"https://support.google.com/accounts/answer/185833\",\n            \"ports\":[\n              {\"encryption\":\"TLS\",\"port\":587},\n              {\"encryption\":\"SSL\",\"port\":465}\n            ],\n            \"provider\":\"Gmail\",\n            \"smtp_host\":\"smtp.gmail.com\"\n          },\n          \"smtp_username\":\"voramx@gmail.com\",\n          \"updated_at\":\"2026-05-22T12:07:51.554794\"\n        },\n        ...\n      ]\n      ```\n\n      ## Sample Error Response\n      ```json\n      {\n        \"error\":\"Error occurred: {error_details}\",\n      }\n      ```\n  - info:\n      name: Webhooks\n      type: http\n      seq: 5\n    http:\n      method: POST\n      url: ''\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: Webhook implementation coming soon.\ndocs:\n  content: |-\n    # API Documentation\n\n    ## Introduction\n\n    VoraMX provides a powerful API for integrating email messaging in your applications.\n\n    BASE_URL: `https://mx.vorateck.com.ng/api`\n\n    ## Requirements\n\n    ## API Key & Secret Key\n\n    ## Authorization\n\n    All requests must be authenticated using your `API Key` and `Secret Key` in request header.\n\n    ```json\n    headers = {\n      \"X-API-KEY\": \"YOUR_API_KEY\",\n      \"X-SECRET-KEY\": \"YOUR_SECRET_KEY\"\n    }\n    ```\n\n    ## Sample Request Body\n\n    ```json\n    {\n      \"account_id\": \"vorateck_s7v230fqri\",\n      \"recipients\": [\n        \"user1@example.com\",\n        \"user2@example.com\"\n      ],\n      \"subject\": \"Test Subject\",\n      \"content\": \"Hello World\"\n    }\n    ```\n\n    ## Sample Request (Javascript)\n\n    ```javascript\n    const url = \"https://mx.vorateck.com.ng/api/send-mail\";\n\n    const options =  {\n        \"method\": \"POST\",\n        \"headers\": {\n            \"Accept\": \"application/json\",\n            \"Content-Type\": \"application/json\",\n            \"X-API-KEY\": \"your-api-key\",\n            \"X-SECRET-KEY\": \"your-secret-key\"\n        },\n        \"body\": {\n            \"account_id\": \"vorateck_s7v230fqri\",\n            \"recipients\": [\n                \"user1@example.com\",\n                \"user2@example.com\"\n            ],\n            \"subject\": \"Test Subject\",\n            \"content\": \"Hello World\"\n        }\n    };\n\n    let response = await fetch(url, options);\n    let data = await response.json();\n\n    console.log(data)\n    ```\n\n    ## Sample Response (success)\n\n    ```json\n    {\n        \"message\": \"Message sent successfully\",\n        \"message_id\": \"b77d64ad-2ce0-4001-b18c-ba5a77fad8c6\",\n        \"status\": \"completed\",\n        \"success\": true\n    }\n    ```\n\n    ## Sample Response (error)\n\n    ```json\n    {\n        \"message\": \"SMTP authentication failed\",\n        \"message_id\": \"b77d64ad-2ce0-4001-b18c-ba5a77fad8c6\",\n        \"status\": \"failed\",\n        \"success\": false\n    }\n    ```\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    presets:\n      requestType: http\n      requestUrl: https://mx.vorateck.com.ng/api\n    exportedAt: '2026-06-04T07:09:53.543Z'\n    exportedUsing: Bruno/3.3.0\n";
